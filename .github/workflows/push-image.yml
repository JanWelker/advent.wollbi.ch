---
# Builds the image the cluster runs. Renovate moves the tag in
# JanWelker/homelab-apps; nothing here deploys. A pull request builds the
# image too, which is the check its merge waits for, and pushes it as
# sha-<head SHA> for the cluster's pull request preview -- see
# https://homelab-apps.wlkr.ch/previews/. A fork's build cannot push.
# A push to main that changes more than docs or CI releases the next patch
# version: the image gets the semver tags and the commit gets v<version>.
# Pushing a v* tag by hand still releases a minor or major version.
name: Push image

"on":
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-image-${{ github.ref }}
  # Cancelling a main run between the image push and the tag push would
  # publish a version that the next run builds again.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git describe --exact-match --tags --match 'v*' HEAD >/dev/null 2>&1; then
            echo "HEAD is already tagged; nothing to release."
            exit 0
          fi
          if git diff --quiet "$latest" HEAD -- . ':!*.md' ':!.github' ':!renovate.json'; then
            echo "Only docs or CI changed since $latest; nothing to release."
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "version=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        env:
          # The preview is looked up by the pull request's head commit, not
          # the merge commit the checkout builds.
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/janwelker/advent-wollbi-ch
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag the release
        if: steps.version.outputs.version != ''
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
