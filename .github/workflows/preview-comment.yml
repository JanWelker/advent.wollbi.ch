---
# Posts the preview's address when a pull request is labelled `preview`. The
# cluster deploys it; see https://homelab-apps.wlkr.ch/previews/
name: Preview comment

"on":
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.label.name == 'preview' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: https://advent-wollbi-pr-${PR}.k8s.wlkr.ch

          Deployed about a minute after the Push image check passes, and redeployed on every push. Removing the label or closing the pull request deletes it, database included."
